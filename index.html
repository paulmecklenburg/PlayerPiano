<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Piano Editor</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://unpkg.com/midi-writer-js@2.1.4/browser/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <div class="controls-group">
                <button id="new-song">New</button>
                <button id="play-pause">Play</button>
                <button id="stop">Stop</button>
                <button id="undo" title="Ctrl+Z">Undo</button>
                <button id="redo" title="Ctrl+Y">Redo</button>
            </div>
            <div class="controls-group">
                <div class="toggle-container">
                    <label>Edit</label>
                    <input type="checkbox" id="mode-toggle" checked>
                </div>
                <div class="toggle-container">
                    <label>Delete</label>
                    <input type="checkbox" id="delete-toggle">
                </div>
            </div>
            <div class="controls-group">
                <input type="text" id="song-name" placeholder="Song Name" value="My Song" style="width: 100px;">
                <div class="input-unit">
                    <label>BPM</label>
                    <input type="number" id="bpm-input" value="120" min="20" max="300" style="width: 50px;">
                </div>
                <select id="time-signature">
                    <option value="4/4">4/4</option>
                    <option value="3/4">3/4</option>
                    <option value="2/4">2/4</option>
                    <option value="6/8">6/8</option>
                </select>
                <select id="instrument-type">
                    <option value="default">Default Synth</option>
                    <option value="raw-triangle">Raw Triangle (Gate)</option>
                    <option value="triangle">Pure Triangle</option>
                    <option value="square">Pure Square</option>
                    <option value="sawtooth">Pure Sawtooth</option>
                    <option value="fmsynth">Electric Piano (FM)</option>
                    <option value="amsynth">Warm Organ (AM)</option>
                </select>
            </div>
            <div class="controls-group">
                <button id="save-song">Save</button>
                <select id="load-song">
                    <option value="">Load...</option>
                </select>
                <div class="dropdown">
                    <button id="file-actions-btn">Menu ▾</button>
                    <div id="file-actions-content" class="dropdown-content">
                        <a href="#" id="export-json">Export Song (JSON)</a>
                        <a href="#" id="export-library">Export Library (JSON)</a>
                        <a href="#" id="import-file">Import File...</a>
                        <a href="#" id="copy-json">Copy to Clipboard</a>
                        <a href="#" id="paste-json">Paste from Clipboard</a>
                        <a href="#" id="share-url">Get Shareable URL</a>
                        <a href="#" id="export-midi">Export as .mid</a>
                    </div>
                </div>
            </div>
            <input type="file" id="hidden-import" style="display: none;" accept=".json">
            <div class="instructions">
                L: Add/Move | R/Delete: Del | Scroll: Wheel/Drag
            </div>
        </header>

        <main>
            <div id="editor-container">
                <canvas id="piano-roll"></canvas>
            </div>
            <div id="piano-keys-container">
                <!-- 88 keys will be generated here -->
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
